<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#111827" />
<title>My Training Tracker</title><link rel="manifest" href="manifest.webmanifest"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Training Tracker">
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#6b7280;--line:#e7eaf0;--accent:#315efb;--good:#15803d;--warn:#b45309;--bad:#b91c1c;--shadow:0 8px 30px rgba(20,30,55,.07);--r:18px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.app{max-width:1050px;margin:auto;padding:20px 16px 90px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.brand h1{font-size:23px;margin:0}.brand p{margin:2px 0 0;color:var(--muted)}.pill{padding:9px 12px;background:#fff;border:1px solid var(--line);border-radius:999px;color:var(--muted)}
nav{display:flex;gap:7px;overflow:auto;margin-bottom:18px;padding-bottom:2px}nav button{white-space:nowrap;padding:10px 14px;border-radius:12px;background:transparent;color:var(--muted)}nav button.active{background:var(--text);color:#fff}
.subnav{display:flex;gap:7px;overflow:auto;margin-bottom:9px;padding-bottom:2px}.subnav button{white-space:nowrap;padding:9px 13px;border-radius:11px;background:transparent;color:var(--muted)}.subnav button.active{background:var(--text);color:#fff}.notice{padding:12px 14px;border-radius:13px;background:#fff7ed;border:1px solid #fed7aa;color:#9a3412}.clickable{cursor:pointer;transition:.15s}.clickable:hover{transform:translateY(-1px)}.grid{display:grid;gap:14px}.scores{grid-template-columns:repeat(4,1fr)}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:17px;box-shadow:var(--shadow)}.score{position:relative;min-height:145px}.score .emoji{font-size:22px}.score h3{margin:7px 0 2px;font-size:15px}.num{font-size:35px;font-weight:750;letter-spacing:-1px}.bar{height:7px;background:#edf0f5;border-radius:9px;overflow:hidden;margin:9px 0}.fill{height:100%;border-radius:9px;background:var(--accent)}.status{font-size:12px;color:var(--muted)}
.overall{display:flex;align-items:center;gap:20px}.overall .big{font-size:54px;font-weight:800}.section-title{display:flex;justify-content:space-between;align-items:center;margin:25px 2px 10px}.section-title h2{font-size:17px;margin:0}.muted{color:var(--muted)}.two{grid-template-columns:1.25fr .75fr}.three{grid-template-columns:repeat(3,1fr)}.metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.metric{padding:12px;border:1px solid var(--line);border-radius:13px}.metric b{display:block;font-size:17px}.metric span{font-size:12px;color:var(--muted)}
.plan-row{display:grid;grid-template-columns:90px 1fr auto;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.plan-row:last-child{border-bottom:0}.tag{font-size:12px;padding:5px 8px;border-radius:8px;background:#f0f2f6;display:inline-block}.done{color:var(--good)}.pending{color:var(--warn)}
.list{display:grid;gap:9px}.entry{display:flex;justify-content:space-between;gap:12px;padding:12px;border:1px solid var(--line);border-radius:13px}.entry small{color:var(--muted)}.btn{padding:10px 13px;border-radius:11px;background:var(--text);color:#fff}.btn.secondary{background:#eef1f6;color:var(--text)}.btn.small{padding:7px 10px;font-size:13px}.actions{display:flex;gap:8px;flex-wrap:wrap}
label{display:grid;gap:5px;font-size:13px;color:var(--muted)}input,select,textarea{width:100%;padding:10px 11px;border:1px solid #dfe3eb;border-radius:10px;background:#fff;color:var(--text)}textarea{min-height:75px;resize:vertical}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.formgrid .full{grid-column:1/-1}.hidden{display:none!important}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:11px 15px;border-radius:12px;display:none;z-index:10}
@media(max-width:760px){.app{padding:15px 12px 85px}.scores{grid-template-columns:repeat(2,1fr)}.two,.three{grid-template-columns:1fr}.score{min-height:132px}.overall .big{font-size:45px}.plan-row{grid-template-columns:65px 1fr auto}.top{align-items:flex-start}.brand h1{font-size:21px}}
.polar-badge{display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border-radius:999px;background:#eef6ff;color:#155e9b;font-size:12px}.sleep-chart{height:72px;display:flex;align-items:stretch;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#f8fafc}.sleep-stage{display:flex;align-items:flex-end;justify-content:center;font-size:10px;color:#fff;min-width:6px}.sleep-stage span{padding-bottom:6px}.sleep-stage.wake{background:#94a3b8}.sleep-stage.light{background:#60a5fa}.sleep-stage.deep{background:#3730a3}.sleep-stage.rem{background:#a855f7}.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:9px;font-size:12px;color:var(--muted)}.dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:4px}.settings-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}.settings-row:last-child{border-bottom:0}.toggle{width:46px;height:26px;border-radius:99px;background:#d1d5db;position:relative}.toggle.on{background:#315efb}.toggle:after{content:"";position:absolute;width:20px;height:20px;top:3px;left:3px;border-radius:50%;background:#fff;transition:.15s}.toggle.on:after{left:23px}.chart-bars{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;align-items:end;height:150px;margin-top:12px}.chart-bar{display:flex;flex-direction:column;align-items:center;gap:6px}.chart-bar .bar-outer{width:55px;height:110px;background:#eef1f6;border-radius:10px 10px 4px 4px;display:flex;align-items:flex-end;overflow:hidden}.chart-bar .bar-inner{width:100%;background:var(--accent);border-radius:10px 10px 0 0}.chart-bar small{color:var(--muted)}</style>
</head>
<body>
<div class="app">
<header class="top"><div class="brand"><h1>My Training Tracker</h1><p id="dateLabel"></p></div><div class="actions"><button type="button" class="btn small secondary" data-action="settings">⚙ Reminders</button><span class="pill">V6 prototype</span></div></header>
<div id="periodNav"></div>
<div id="categoryNav"></div>
<main id="app"></main>
</div><div id="toast" class="toast"></div>
<script>
const today=new Date().toISOString().slice(0,10);
const defaultData={
 settings:{reminders:{food:true,bpMorning:true,bpEvening:true,supplements:true,foodTime:"20:00",bpMorningTime:"08:00",bpEveningTime:"20:00",supplementsTime:"08:00"},notifications:false,pushSubscribed:false},
 days:{[today]:{sleep:{duration:5.63,bed:'23:42',wake:'05:20',rem:72,deep:58,charge:52},recovery:{hrv:61,rhr:61,ans:-4.8},activity:{steps:8421,training:'',duration:0,rpe:'',load:0},nutrition:{protein:90,carbs:'',fat:'',calories:'',alcohol:false,breakfast:'Greek yoghurt, granola and fruit',lunch:'',dinner:'',snacks:'',creatine:true,proteinSupplement:15},body:{weight:'',bp:''},meds:{minoxidil:true,finasteride:true,ramipril:true,creatine:true}}},
 plan:{week:'',sessions:[{day:'Mon',type:'Run',target:'5–6 km',priority:'High',done:false},{day:'Tue',type:'Gym',target:'Upper body',priority:'High',done:false},{day:'Wed',type:'Rest',target:'Recovery',priority:'',done:true},{day:'Thu',type:'Gym',target:'Lower body',priority:'High',done:false},{day:'Fri',type:'Pilates',target:'1 session',priority:'Medium',done:false},{day:'Sat',type:'Run',target:'10–12 km',priority:'High',done:false},{day:'Sun',type:'Football',target:'40 min',priority:'Medium',done:false}]},
 gym:[]
};
let data=JSON.parse(localStorage.getItem('mtt')||'null')||defaultData;
if(!data.days[today]) data.days[today]=JSON.parse(JSON.stringify(defaultData.days[today]));
data.settings=data.settings||JSON.parse(JSON.stringify(defaultData.settings));
data.settings.pushSubscribed=!!data.settings.pushSubscribed;
data.settings.reminders=Object.assign({},defaultData.settings.reminders,data.settings.reminders||{});
// Migrate the older reminder names/times to the simpler V4 schedule.
if(data.settings.reminders.bp && data.settings.reminders.bpMorning===undefined) data.settings.reminders.bpMorning=data.settings.reminders.bp;
if(data.settings.reminders.bp && data.settings.reminders.bpEvening===undefined) data.settings.reminders.bpEvening=data.settings.reminders.bp;
if(data.settings.reminders.bpTime && !data.settings.reminders.bpEveningTime) data.settings.reminders.bpEveningTime=data.settings.reminders.bpTime;
if(data.settings.reminders.weight!==undefined) delete data.settings.reminders.weight;
if(data.settings.reminders.weightTime!==undefined) delete data.settings.reminders.weightTime;
data.gym=data.gym||[];
Object.values(data.days).forEach(day=>{day.nutrition=day.nutrition||{};day.body=day.body||{};day.meds=day.meds||{};day.nutrition.foodEstimate=day.nutrition.foodEstimate||null;day.body.bpMorningReadings=Array.isArray(day.body.bpMorningReadings)?day.body.bpMorningReadings.filter(Boolean): (day.body.bpMorning?[day.body.bpMorning]:[]);day.body.bpEveningReadings=Array.isArray(day.body.bpEveningReadings)?day.body.bpEveningReadings.filter(Boolean): (day.body.bpEvening?[day.body.bpEvening]:[]);day.body.bpMorning=lowestBP(day.body.bpMorningReadings)||'';day.body.bpEvening=lowestBP(day.body.bpEveningReadings)||'';day.body.bp=day.body.bpEvening||day.body.bpMorning||'';day.meds.creatine=day.meds.creatine!==false;day.meds.minoxidil=day.meds.minoxidil!==false;day.meds.finasteride=day.meds.finasteride!==false;day.meds.ramipril=day.meds.ramipril!==false;day.meds.supplementsTaken=day.meds.supplementsTaken===true;});
let period='daily', category='overall', screen='dashboard';
const periods={daily:'Daily',weekly:'Weekly',monthly:'Monthly'};
const categories={overall:'Overall',sleep:'Sleep',recovery:'Recovery',activity:'Activity',nutrition:'Nutrition'};

function save(){localStorage.setItem('mtt',JSON.stringify(data));showToast('Saved');render()}
function showToast(x){const t=document.getElementById('toast');t.textContent=x;t.style.display='block';setTimeout(()=>t.style.display='none',1300)}
function d(){return data.days[today]}
function esc(v){return String(v??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]))}
function parseBP(v){let m=String(v||'').trim().match(/^(\d{2,3})\s*\/\s*(\d{2,3})$/);return m?{s:+m[1],d:+m[2],raw:String(v).trim()}:null}
function lowestBP(readings){let valid=(readings||[]).map(parseBP).filter(Boolean);if(!valid.length)return '';valid.sort((a,b)=>a.s-b.s || a.d-b.d);return valid[0].raw}

function scoreSleep(x){let dur=Math.min(100,(x.sleep.duration/8)*100);return Math.round(dur*.55+x.sleep.charge*.45)}
function scoreRecovery(x){let hrv=Math.max(0,Math.min(100,(x.recovery.hrv/70)*100));let rhr=Math.max(0,Math.min(100,100-(x.recovery.rhr-50)*4));let ans=Math.max(0,Math.min(100,50+x.recovery.ans*5));return Math.round(hrv*.4+rhr*.3+ans*.3)}
function scoreActivity(x){let base=x.activity.training?70:45;let steps=Math.min(100,x.activity.steps/100);let planDone=data.plan.sessions.filter(s=>s.done).length;let planScore=data.plan.sessions.length?planDone/data.plan.sessions.length*100:100;return Math.round(base*.25+steps*.2+planScore*.55)}
function scoreNutrition(x){let protein=Math.min(100,x.nutrition.protein/100*100);let meals=[x.nutrition.breakfast,x.nutrition.lunch,x.nutrition.dinner].filter(Boolean).length;let mealsScore=meals/3*100;let alcohol=x.nutrition.alcohol?60:100;return Math.round(protein*.55+mealsScore*.3+alcohol*.15)}
function scores(x=d()){let s=scoreSleep(x),r=scoreRecovery(x),a=scoreActivity(x),n=scoreNutrition(x);return{s,r,a,n,o:Math.round((s+r+a+n)/4)}}

function scoreCard(icon,name,val,detail,target){return `<button class="card score clickable" style="text-align:left;width:100%" onclick="category='${target}';screen='dashboard';render()"><div class="emoji">${icon}</div><h3>${name}</h3><div class="num">${val}<small style="font-size:17px">/100</small></div><div class="bar"><div class="fill" style="width:${val}%"></div></div><div class="status">${val>=80?'Good':val>=65?'Fair':'Needs attention'} · ${detail}</div></button>`}

function renderNav(){
  document.getElementById('periodNav').innerHTML=`<div class="subnav">${Object.entries(periods).map(([k,v])=>`<button type="button" class="${period===k?'active':''}" onclick="period='${k}';screen='dashboard';render()">${v}</button>`).join('')}</div>`;
  document.getElementById('categoryNav').innerHTML=`<div class="subnav">${Object.entries(categories).map(([k,v])=>`<button type="button" class="${category===k?'active':''}" onclick="category='${k}';screen='dashboard';render()">${v}</button>`).join('')}</div>`;
}

function overallView(){
 const x=d(),s=scores(x);
 return `<div class="grid scores">
 ${scoreCard('😴','Sleep',s.s,`${x.sleep.duration.toFixed(1)}h · charge ${x.sleep.charge}`,'sleep')}
 ${scoreCard('❤️','Recovery',s.r,`HRV ${x.recovery.hrv} · RHR ${x.recovery.rhr}`,'recovery')}
 ${scoreCard('🏃','Activity',s.a,`${data.plan.sessions.filter(z=>z.done).length}/${data.plan.sessions.length} plan items`,'activity')}
 ${scoreCard('🍽️','Nutrition',s.n,`${x.nutrition.protein}g protein`,'nutrition')}</div>
 <div class="section-title"><h2>Overall</h2></div>
 <div class="card overall"><div class="big">${s.o}<small style="font-size:18px">/100</small></div><div><b>${period==='daily'?'Today':period==='weekly'?'This week':'This month'}</b><p class="muted">A transparent summary of sleep, recovery, activity and nutrition. Tap a score above for the detail.</p></div></div>
 <div class="section-title"><h2>${period==='daily'?'Today':period==='weekly'?'This week':'This month'} at a glance</h2></div>
 ${period==='daily'?dailyGlance(x):period==='weekly'?weeklyGlance():monthlyGlance()}`;
}

function dailyGlance(x){
 const missing=[];
 if(!x.nutrition.breakfast&&!x.nutrition.lunch&&!x.nutrition.dinner&&!x.nutrition.snacks) missing.push('Food');
 if(!x.body.bpMorning) missing.push('AM BP');
 if(!x.body.bpEvening) missing.push('PM BP');
 const reminder=missing.length?`<div class="notice"><b>Manual data to add</b><br><span>${missing.join(' · ')}${x.meds.supplementsTaken?'':' · Supplements'}</span><div class="actions" style="margin-top:8px"><button type="button" class="btn small" data-action="manual">Open manual entry</button></div></div>`:'<div class="card"><b>Manual data up to date</b><p class="muted">Food, blood pressure and supplements are all logged for today.</p></div>';
 return `${reminder}<div class="grid two" style="margin-top:14px"><div class="card"><b>Manual quick status</b><div class="metrics" style="margin-top:10px"><div class="metric"><b>${x.meds.supplementsTaken?'✓ Taken':'○ Not logged'}</b><span>Supplements</span></div><div class="metric"><b>${x.body.bpMorning||'—'}</b><span>AM BP · lowest</span></div><div class="metric"><b>${x.body.bpEvening||'—'}</b><span>PM BP · lowest</span></div><div class="metric"><b>${x.nutrition.foodEstimate?x.nutrition.foodEstimate.calories+' kcal':'—'}</b><span>Estimated food</span></div></div></div><div class="card"><b>Quick actions</b><div class="actions" style="margin-top:10px"><button type="button" class="btn small" data-action="food">🍽️ Log food</button><button type="button" class="btn small secondary" data-action="bp">❤️ Log BP</button><button type="button" class="btn small secondary" data-action="supplements">✓ Supplements</button></div></div></div><div class="grid two" style="margin-top:14px"><div class="card"><b>Key metrics</b><div class="metrics" style="margin-top:10px">
 <div class="metric"><b>${x.sleep.bed}</b><span>Bedtime</span></div><div class="metric"><b>${x.sleep.wake}</b><span>Wake time</span></div>
 <div class="metric"><b>${x.sleep.rem} min</b><span>REM</span></div><div class="metric"><b>${x.sleep.deep} min</b><span>Deep</span></div>
 <div class="metric"><b>${x.recovery.hrv}</b><span>HRV</span></div><div class="metric"><b>${x.recovery.rhr}</b><span>Resting HR</span></div>
 <div class="metric"><b>${x.activity.steps.toLocaleString()}</b><span>Steps</span></div><div class="metric"><b>${x.nutrition.protein}g</b><span>Protein</span></div></div></div>
 <div class="card"><b>Weekly plan</b><div class="list" style="margin-top:10px">${data.plan.sessions.map(s=>`<div class="entry"><div><b>${s.day} · ${s.type}</b><br><small>${s.target}</small></div><span class="${s.done?'done':'pending'}">${s.done?'✓':'○'}</span></div>`).join('')}</div></div></div>`;
}

function weeklyGlance(){
 const done=data.plan.sessions.filter(s=>s.done).length,total=data.plan.sessions.length||1;
 return `<div class="card"><div class="section-title" style="margin-top:0"><h2>Weekly training plan</h2><span class="pill">${done}/${total} completed</span></div><div class="bar"><div class="fill" style="width:${Math.round(done/total*100)}%"></div></div><p class="muted">Training score includes rolling progress against this week's plan.</p>${data.plan.sessions.map((s,i)=>`<div class="plan-row"><span class="tag">${s.day}</span><div><b>${s.type}</b><br><small class="muted">${s.target}${s.priority?' · '+s.priority+' priority':''}</small></div><button class="btn small ${s.done?'secondary':''}" onclick="togglePlan(${i})">${s.done?'Done':'Mark done'}</button></div>`).join('')}</div>`;
}

function monthlyGlance(){
 const rows=Object.entries(data.days).sort((a,b)=>a[0].localeCompare(b[0]));
 const avg=key=>rows.length?Math.round(rows.reduce((t,[,x])=>t+scores(x)[key],0)/rows.length):0;
 return `<div class="grid three"><div class="card"><b>Average sleep</b><div class="num">${avg('s')}</div><span class="muted">/100</span></div><div class="card"><b>Average recovery</b><div class="num">${avg('r')}</div><span class="muted">/100</span></div><div class="card"><b>Average nutrition</b><div class="num">${avg('n')}</div><span class="muted">/100</span></div></div>
 <div class="section-title"><h2>Monthly tracker</h2></div>${historyTable()}`;
}

function sleepDetail(){
 const x=d(); const stages=[['wake',7],['light',50],['deep',18],['light',32],['rem',24],['light',40],['deep',16],['light',35],['rem',26],['light',34],['deep',14],['light',30],['rem',25],['light',36],['wake',8]];
 return `<div class="card"><div class="section-title" style="margin-top:0"><h2>Sleep detail</h2><span class="polar-badge">● Polar data · read only</span></div>
 <div class="grid three"><div class="metric"><b>${scoreSleep(x)}</b><span>Sleep score</span></div><div class="metric"><b>${x.sleep.duration.toFixed(1)}h</b><span>Total sleep</span></div><div class="metric"><b>${x.sleep.charge}</b><span>Sleep Charge</span></div></div>
 <div class="section-title"><h2>Sleep structure</h2><span class="muted">Polar-style chart</span></div>
 <div class="sleep-chart">${stages.map(([stage,w])=>`<div class="sleep-stage ${stage}" style="width:${w}%"><span>${w>14?stage:''}</span></div>`).join('')}</div>
 <div class="legend"><span><i class="dot" style="background:#94a3b8"></i>Awake</span><span><i class="dot" style="background:#60a5fa"></i>Light</span><span><i class="dot" style="background:#3730a3"></i>Deep</span><span><i class="dot" style="background:#a855f7"></i>REM</span></div>
 <div class="metrics" style="margin-top:12px"><div class="metric"><b>${x.sleep.bed}</b><span>Bedtime</span></div><div class="metric"><b>${x.sleep.wake}</b><span>Wake time</span></div><div class="metric"><b>${x.sleep.rem} min</b><span>REM</span></div><div class="metric"><b>${x.sleep.deep} min</b><span>Deep sleep</span></div></div>
 <div class="section-title"><h2>Sleep stage proportions</h2></div><div class="chart-bars"><div class="chart-bar"><div class="bar-outer"><div class="bar-inner" style="height:${Math.min(100,x.sleep.rem/120*100)}%"></div></div><small>REM</small></div><div class="chart-bar"><div class="bar-outer"><div class="bar-inner" style="height:${Math.min(100,x.sleep.deep/100*100)}%"></div></div><small>Deep</small></div><div class="chart-bar"><div class="bar-outer"><div class="bar-inner" style="height:${Math.min(100,(x.sleep.duration*60-x.sleep.rem-x.sleep.deep)/360*100)}%"></div></div><small>Light</small></div></div>
 <p class="muted">When Polar is connected, these visuals will use Polar's actual sleep-stage/hypnogram data. The AccessLink API exposes sleep stages, sleep score and sleep evaluation data. This prototype uses illustrative stage segments.</p></div>`;
}
function recoveryDetail(){
 const x=d(); return `<div class="card"><div class="section-title" style="margin-top:0"><h2>Recovery detail</h2><span class="polar-badge">● Polar data · read only</span></div><div class="grid three"><div class="metric"><b>${scoreRecovery(x)}</b><span>Recovery score</span></div><div class="metric"><b>${x.recovery.hrv}</b><span>HRV</span></div><div class="metric"><b>${x.recovery.rhr}</b><span>Resting HR</span></div><div class="metric"><b>${x.recovery.ans}</b><span>ANS Charge</span></div><div class="metric"><b>—</b><span>Skin temperature</span></div><div class="metric"><b>${x.activity.load||0}</b><span>Recent training load</span></div></div><p class="muted">Once Polar is connected, this page will be populated automatically with the full recovery dataset.</p></div>`;
}
function activityDetail(){
 const done=data.plan.sessions.filter(s=>s.done).length,total=data.plan.sessions.length;
 const x=d(); return `<div class="grid two"><div class="card"><div class="section-title" style="margin-top:0"><h2>Activity</h2></div><div class="metrics"><div class="metric"><b>${x.activity.steps.toLocaleString()}</b><span>Steps</span></div><div class="metric"><b>${x.activity.duration||0} min</b><span>Training time</span></div><div class="metric"><b>${x.activity.load||0}</b><span>Training load</span></div><div class="metric"><b>${x.activity.rpe||'—'}</b><span>RPE</span></div></div></div><div class="card"><div class="section-title" style="margin-top:0"><h2>Plan progress</h2><button class="btn small" onclick="period='weekly';category='activity';screen='dashboard';render()">Weekly plan</button></div><div class="num">${done}/${total}</div><p class="muted">planned sessions completed</p></div></div><div class="card" style="margin-top:14px"><b>Training sessions</b><p class="muted">Polar sessions will appear here automatically once connected. Gym sessions can be entered manually.</p></div>`;
}
function nutritionDetail(){ const x=d(),e=x.nutrition.foodEstimate; return `<div class="card"><div class="section-title" style="margin-top:0"><h2>Nutrition</h2><button type="button" class="btn small" data-action="food">Log food</button></div><div class="grid four" style="grid-template-columns:repeat(4,1fr)"><div class="metric"><b>${e?e.protein:'—'}g</b><span>Protein</span></div><div class="metric"><b>${e?e.carbs:'—'}g</b><span>Carbs</span></div><div class="metric"><b>${e?e.fat:'—'}g</b><span>Fat</span></div><div class="metric"><b>${e?e.calories:'—'}</b><span>Calories</span></div></div><p class="muted">Macros are estimated from the food descriptions you enter. They are intentionally approximate rather than pretending to be precise nutrition data.</p><div class="section-title"><h2>Supplements & medication</h2></div><div class="metrics"><div class="metric"><b>${x.meds.supplementsTaken?'Taken':'Partially / not logged'}</b><span>Morning checklist</span></div><div class="metric"><b>${x.nutrition.proteinSupplement||'—'}${x.nutrition.proteinSupplement?'g':''}</b><span>Protein supplement</span></div></div><div class="section-title"><h2>Food log</h2></div><div class="list">${[['Breakfast',x.nutrition.breakfast],['Lunch',x.nutrition.lunch],['Dinner',x.nutrition.dinner],['Snacks',x.nutrition.snacks]].map(([k,v])=>`<div class="entry"><div><b>${k}</b><br><small>${esc(v)||'Not logged'}</small></div></div>`).join('')}</div></div>`;}

function foodEntryView(){let x=d();return `<div class="card"><div class="section-title" style="margin-top:0"><h2>Log food</h2><span class="pill">Manual</span></div><p class="muted">Enter what you ate in plain English. The tracker will make a rough estimate of protein, carbohydrates, fat and calories. You can do this after each meal or all at once later.</p><form onsubmit="saveFood(event)"><div class="formgrid"><label class="full">Breakfast<textarea id="breakfast">${esc(x.nutrition.breakfast)}</textarea></label><label class="full">Lunch<textarea id="lunch">${esc(x.nutrition.lunch)}</textarea></label><label class="full">Dinner<textarea id="dinner">${esc(x.nutrition.dinner)}</textarea></label><label class="full">Snacks<textarea id="snacks">${esc(x.nutrition.snacks)}</textarea></label><label>Protein supplement (g)<input id="proteinSupplement" type="number" min="0" step="1" value="${x.nutrition.proteinSupplement||''}" placeholder="e.g. 30"></label><label>Alcohol<select id="alcohol"><option value="false" ${!x.nutrition.alcohol?'selected':''}>No</option><option value="true" ${x.nutrition.alcohol?'selected':''}>Yes</option></select></label></div><div class="actions" style="margin-top:15px"><button class="btn" type="submit">Estimate & save food</button><button type="button" class="btn secondary" data-action="back">Cancel</button></div></form><div class="notice" style="margin-top:15px"><b>How the estimate works</b><br><span>It recognises common foods and typical portions. For example, eggs, chicken, rice, pasta, Greek yoghurt, oats, fruit, bread, salmon, nuts and protein shakes. It will improve as we build out your food library.</span></div></div>`;}

function bpEntryView(){let x=d(),am=x.body.bpMorningReadings||[],pm=x.body.bpEveningReadings||[];return `<div class="card"><div class="section-title" style="margin-top:0"><h2>Blood pressure</h2><span class="pill">Manual</span></div><p class="muted">Take up to three readings in each session. The tracker will display the lowest reading for that session, using the reading with the lowest systolic value and keeping its matching diastolic value.</p><form onsubmit="saveBP(event)"><div class="section-title" style="margin-top:12px"><h2>Morning · 8:00am</h2><span class="muted">${lowestBP(am)||'No reading yet'}</span></div><div class="formgrid"><label>Reading 1<input id="bpMorning1" inputmode="numeric" placeholder="125/82" value="${esc(am[0]||'')}"></label><label>Reading 2<input id="bpMorning2" inputmode="numeric" placeholder="122/80" value="${esc(am[1]||'')}"></label><label>Reading 3<input id="bpMorning3" inputmode="numeric" placeholder="120/79" value="${esc(am[2]||'')}"></label></div><div class="section-title"><h2>Evening · 8:00pm</h2><span class="muted">${lowestBP(pm)||'No reading yet'}</span></div><div class="formgrid"><label>Reading 1<input id="bpEvening1" inputmode="numeric" placeholder="122/80" value="${esc(pm[0]||'')}"></label><label>Reading 2<input id="bpEvening2" inputmode="numeric" placeholder="120/78" value="${esc(pm[1]||'')}"></label><label>Reading 3<input id="bpEvening3" inputmode="numeric" placeholder="118/77" value="${esc(pm[2]||'')}"></label></div><div class="actions" style="margin-top:15px"><button class="btn" type="submit">Save BP</button><button type="button" class="btn secondary" data-action="back">Cancel</button></div></form><div class="notice" style="margin-top:15px"><b>Displayed value</b><br><span>Only the lowest reading from each session is shown elsewhere in the tracker; all three entries remain stored for reference.</span></div></div>`;}

function supplementsView(){let x=d();let all=x.meds.creatine&&x.meds.ramipril&&x.meds.minoxidil&&x.meds.finasteride;return `<div class="card"><div class="section-title" style="margin-top:0"><h2>Morning supplements & medication</h2><span class="pill">8:00am</span></div><p class="muted">Usually you can tap <b>Take all</b>. If you skip something on a particular day, untick just that item.</p><div class="entry" style="align-items:center;margin-bottom:9px"><div><b>Take all</b><br><small>Creatine · Ramipril · Minoxidil · Finasteride</small></div><input type="checkbox" id="suppAll" ${all?'checked':''} data-supp-all style="width:22px;height:22px"></div><div class="list"><label class="entry" style="grid-template-columns:1fr auto;align-items:center;cursor:pointer"><span><b>Creatine</b></span><input type="checkbox" data-supp="creatine" ${x.meds.creatine?'checked':''} style="width:22px;height:22px"></label><label class="entry" style="grid-template-columns:1fr auto;align-items:center;cursor:pointer"><span><b>Ramipril</b></span><input type="checkbox" data-supp="ramipril" ${x.meds.ramipril?'checked':''} style="width:22px;height:22px"></label><label class="entry" style="grid-template-columns:1fr auto;align-items:center;cursor:pointer"><span><b>Minoxidil</b></span><input type="checkbox" data-supp="minoxidil" ${x.meds.minoxidil?'checked':''} style="width:22px;height:22px"></label><label class="entry" style="grid-template-columns:1fr auto;align-items:center;cursor:pointer"><span><b>Finasteride</b></span><input type="checkbox" data-supp="finasteride" ${x.meds.finasteride?'checked':''} style="width:22px;height:22px"></label></div><div class="actions" style="margin-top:15px"><button type="button" class="btn" data-action="save-supplements">Save checklist</button><button type="button" class="btn secondary" data-action="back">Cancel</button></div><p class="muted" style="margin-top:12px">This is a tracking checklist only; use the doses and timing prescribed by your clinician/pharmacist.</p></div>`;}

function entryView(){return `<div class="card"><div class="section-title" style="margin-top:0"><h2>Manual data</h2><span class="muted">Polar fields are read-only</span></div><p class="muted">Keep this screen simple: log food whenever you want, record up to three BP readings in each session, or tick the morning supplement/medication checklist.</p><div class="grid three"><button type="button" class="card clickable" data-action="food"><b>🍽️ Food</b><p class="muted">Log meals and estimate macros</p></button><button type="button" class="card clickable" data-action="bp"><b>❤️ Blood pressure</b><p class="muted">AM + PM readings</p></button><button type="button" class="card clickable" data-action="supplements"><b>✓ Supplements</b><p class="muted">One-tap morning checklist</p></button></div><div class="actions" style="margin-top:15px"><button type="button" class="btn secondary" data-action="back">Back</button></div></div>`;}
function trainingView(){period='weekly';category='activity';return weeklyGlance()}
function planView(){return `<div class="card"><div class="section-title" style="margin-top:0"><h2>Weekly plan</h2><button class="btn small" onclick="addPlan()">Add session</button></div><p class="muted">Define the week here after agreeing the plan in ChatGPT. The tracker records progress against it.</p>${data.plan.sessions.map((s,i)=>`<div class="plan-row"><span class="tag">${s.day}</span><div><b>${s.type}</b><br><small class="muted">${s.target} · ${s.priority||'No priority'}</small></div><div class="actions"><button class="btn small secondary" onclick="editPlan(${i})">Edit</button><button class="btn small secondary" onclick="removePlan(${i})">×</button></div></div>`).join('')}</div>`}
function gymView(){return `<div class="card"><div class="section-title" style="margin-top:0"><h2>Gym log</h2><button class="btn small" onclick="addGym()">Log session</button></div>${data.gym.length?`<div class="list">${data.gym.map((g,i)=>`<div class="entry"><div><b>${esc(g.name)}</b><br><small>${esc(g.date)} · ${g.exercises.length} exercises</small><div class="muted" style="margin-top:5px">${g.exercises.map(e=>`${esc(e.e)} · ${esc(e.sets)} · ${esc(e.weight)}`).join('<br>')}</div></div><button class="btn small secondary" onclick="removeGym(${i})">Remove</button></div>`).join('')}</div>`:'<p class="muted">No gym sessions recorded yet. Log your exercises, sets, reps and weights here.</p>'}</div>`}
function historyView(){let rows=Object.entries(data.days).sort((a,b)=>b[0].localeCompare(a[0]));return `<div class="card"><div class="section-title" style="margin-top:0"><h2>History</h2></div><div class="list">${rows.map(([date,x])=>{let s=scores(x);return `<div class="entry"><div><b>${date}</b><br><small>Sleep ${s.s} · Recovery ${s.r} · Activity ${s.a} · Nutrition ${s.n}</small></div><b>${s.o}</b></div>`}).join('')}</div></div>`}

function settingsView(){let r=data.settings.reminders||{};let pushText=data.settings.pushSubscribed?'✓ Phone notifications connected':'Phone notifications not connected';return `<div class="card"><div class="section-title" style="margin-top:0"><h2>Reminders</h2><span class="pill">Preferences</span></div><p class="muted">Choose when the app should remind you. Food is optional — you can also open the tracker whenever you want.</p><div class="settings-row"><div><b>Morning supplements</b><br><small class="muted">Creatine · Ramipril · Minoxidil · Finasteride</small></div><div class="actions"><input id="supplementsTime" type="time" value="${r.supplementsTime||'08:00'}" style="width:115px"><button type="button" class="toggle ${r.supplements?'on':''}" data-toggle="supplements" aria-label="Toggle supplements reminder"></button></div></div><div class="settings-row"><div><b>Blood pressure — morning</b><br><small class="muted">AM reading</small></div><div class="actions"><input id="bpMorningTime" type="time" value="${r.bpMorningTime||'08:00'}" style="width:115px"><button type="button" class="toggle ${r.bpMorning?'on':''}" data-toggle="bpMorning" aria-label="Toggle morning blood pressure reminder"></button></div></div><div class="settings-row"><div><b>Blood pressure — evening</b><br><small class="muted">PM reading</small></div><div class="actions"><input id="bpEveningTime" type="time" value="${r.bpEveningTime||'20:00'}" style="width:115px"><button type="button" class="toggle ${r.bpEvening?'on':''}" data-toggle="bpEvening" aria-label="Toggle evening blood pressure reminder"></button></div></div><div class="settings-row"><div><b>Food & nutrition</b><br><small class="muted">Optional prompt to log meals</small></div><div class="actions"><input id="foodTime" type="time" value="${r.foodTime||'20:00'}" style="width:115px"><button type="button" class="toggle ${r.food?'on':''}" data-toggle="food" aria-label="Toggle food reminder"></button></div></div><div class="actions" style="margin-top:16px"><button type="button" class="btn" data-action="save-settings">Save reminder settings</button><button type="button" class="btn secondary" data-action="notify-permission">${data.settings.pushSubscribed?'Refresh phone notifications':'Enable phone notifications'}</button>${data.settings.pushSubscribed?'<button type="button" class="btn secondary" data-action="test-notification">Send test</button>':''}</div><p class="muted" style="margin-top:12px"><b>${pushText}</b><br>Phone notifications use Web Push, so they can arrive while the app is closed. On iPhone/iPad, first add this app to your Home Screen.</p><div class="notice" style="margin-top:12px"><b>Reminder times use UK time</b><br><span>The backend follows Europe/London automatically, including BST/GMT changes.</span></div></div>`}

document.addEventListener('click',function(e){const a=e.target.closest('[data-action]');if(a){const act=a.dataset.action;if(act==='manual'){screen='entry';render();return}if(act==='food'){screen='food';render();return}if(act==='bp'){screen='bp';render();return}if(act==='supplements'){screen='supplements';render();return}if(act==='save-supplements'){saveSupplements();return}if(act==='back'){screen='dashboard';category='overall';render();return}if(act==='settings'){screen='settings';render();return}if(act==='save-settings'){saveReminderSettings();return}if(act==='notify-permission'){requestNotifications();return}if(act==='test-notification'){sendTestNotification();return}}const t=e.target.closest('[data-toggle]');if(t){data.settings.reminders[t.dataset.toggle]=!data.settings.reminders[t.dataset.toggle];localStorage.setItem('mtt',JSON.stringify(data));render();}});
document.addEventListener('change',function(e){const all=e.target.closest('[data-supp-all]');if(all){['creatine','ramipril','minoxidil','finasteride'].forEach(k=>{const el=document.querySelector(`[data-supp="${k}"]`);if(el)el.checked=all.checked});return}const item=e.target.closest('[data-supp]');if(item){const checks=['creatine','ramipril','minoxidil','finasteride'].map(k=>document.querySelector(`[data-supp="${k}"]`)?.checked!==false);const master=document.querySelector('[data-supp-all]');if(master)master.checked=checks.every(Boolean);}});
function saveReminderSettings(){let r=data.settings.reminders;r.foodTime=foodTime.value;r.bpMorningTime=bpMorningTime.value;r.bpEveningTime=bpEveningTime.value;r.supplementsTime=supplementsTime.value;localStorage.setItem('mtt',JSON.stringify(data));syncPushSubscription(false).catch(()=>{});showToast('Reminder settings saved')}
function base64ToUint8Array(base64){let padding='='.repeat((4-base64.length%4)%4);let raw=atob((base64+padding).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from([...raw].map(c=>c.charCodeAt(0)))}
function deviceId(){let id=localStorage.getItem('mtt-device-id');if(!id){id=crypto.randomUUID?crypto.randomUUID():'mtt-'+Date.now()+'-'+Math.random().toString(36).slice(2);localStorage.setItem('mtt-device-id',id)}return id}
async function syncPushSubscription(requestPermission=true){
 if(!('serviceWorker' in navigator)||!('PushManager' in window)){throw new Error('This browser does not support Web Push.')}
 const registration=await navigator.serviceWorker.ready;
 let permission=Notification.permission;
 if(requestPermission && permission!=='granted') permission=await Notification.requestPermission();
 if(permission!=='granted') throw new Error('Notification permission was not granted.');
 const configResponse=await fetch('/api/push/config',{cache:'no-store'});
 const config=await configResponse.json();
 if(!configResponse.ok) throw new Error(config.error||'Push notifications are not configured on the server yet.');
 let subscription=await registration.pushManager.getSubscription();
 if(!subscription) subscription=await registration.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:base64ToUint8Array(config.publicKey)});
 const r=data.settings.reminders||{};
 const response=await fetch('/api/push/subscribe',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({deviceId:deviceId(),subscription:subscription.toJSON(),reminders:r,timezone:Intl.DateTimeFormat().resolvedOptions().timeZone||'Europe/London'})});
 const result=await response.json();
 if(!response.ok) throw new Error(result.error||'Could not connect notifications.');
 data.settings.notifications=true;data.settings.pushSubscribed=true;localStorage.setItem('mtt',JSON.stringify(data));
}
async function requestNotifications(){try{await syncPushSubscription(true);showToast('Phone notifications connected');render()}catch(error){console.error(error);showToast(error.message||'Notifications could not be enabled')}}
async function sendTestNotification(){try{await syncPushSubscription(false);const response=await fetch('/api/push/test',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({deviceId:deviceId()})});const result=await response.json();if(!response.ok)throw new Error(result.error||'Test notification failed.');showToast('Test notification sent')}catch(error){console.error(error);showToast(error.message||'Test notification failed')}}

const FOOD_DB=[
 ['egg',78,6.3,0.6,5.3],['eggs',78,6.3,0.6,5.3],['chicken breast',330,62,0,7],['chicken',165,31,0,3.6],['salmon',280,29,0,18],['tuna',130,29,0,1],['beef',250,26,0,17],['steak',300,36,0,18],['rice',205,4.3,45,0.4],['pasta',300,10,60,2],['potato',160,4,37,0.2],['oats',150,5,27,3],['greek yoghurt',130,12,8,5],['yoghurt',120,8,12,4],['granola',220,5,32,8],['banana',105,1.3,27,0.4],['apple',95,0.5,25,0.3],['berries',70,1,17,0.5],['bread',100,4,19,1.2],['toast',100,4,19,1.2],['wrap',190,6,32,4.5],['cheese',115,7,1,9],['avocado',240,3,12,22],['nuts',170,5,6,15],['peanut butter',95,4,3,8],['milk',120,4,12,5],['protein shake',150,25,5,3],['protein powder',120,24,3,2],['crisps',160,2,15,10],['chocolate',140,2,15,8],['cereal',150,4,30,2],['beans',120,7,20,1],['lentils',115,9,20,0.5],['hummus',170,5,8,14],['oil',120,0,0,14],['curry',350,25,20,18]
];
function estimateFood(text){let lower=(text||'').toLowerCase();let out={protein:0,carbs:0,fat:0,calories:0,matched:[]};let matchedNames=[];for(const [name,kcal,p,c,f] of FOOD_DB.slice().sort((a,b)=>b[0].length-a[0].length)){if(matchedNames.some(n=>name!==n&&n.includes(name)))continue;let escaped=name.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');let boundary=new RegExp('(^|\\s|,|\\(|\\))'+escaped+'($|\\s|,|\\(|\\))');if(boundary.test(lower)){let count=1;let m=lower.match(new RegExp('([0-9]+(?:\\.[0-9]+)?)\\s*(?:x|×)?\\s*(?:large\\s+|small\\s+)?'+escaped));if(m)count=Math.min(6,Math.max(.25,parseFloat(m[1])));out.calories+=kcal*count;out.protein+=p*count;out.carbs+=c*count;out.fat+=f*count;out.matched.push((count===1?'':count+' × ')+name);matchedNames.push(name)}}return {protein:Math.round(out.protein),carbs:Math.round(out.carbs),fat:Math.round(out.fat),calories:Math.round(out.calories),matched:out.matched};}
function saveFood(e){e.preventDefault();let x=d();x.nutrition.breakfast=breakfast.value.trim();x.nutrition.lunch=lunch.value.trim();x.nutrition.dinner=dinner.value.trim();x.nutrition.snacks=snacks.value.trim();x.nutrition.proteinSupplement=+proteinSupplement.value||0;x.nutrition.alcohol=alcohol.value==='true';let combined=[x.nutrition.breakfast,x.nutrition.lunch,x.nutrition.dinner,x.nutrition.snacks].filter(Boolean).join(', ');let est=estimateFood(combined);est.protein+=x.nutrition.proteinSupplement||0;est.calories+=Math.round((x.nutrition.proteinSupplement||0)*4);est.matched=est.matched||[];if(x.nutrition.proteinSupplement)est.matched.push('protein supplement');x.nutrition.foodEstimate=est;x.nutrition.protein=est.protein;x.nutrition.carbs=est.carbs;x.nutrition.fat=est.fat;x.nutrition.calories=est.calories;screen='dashboard';category='nutrition';save()}
function saveBP(e){e.preventDefault();let valid=v=>/^\d{2,3}\s*\/\s*\d{2,3}$/.test(v.trim());let am=[bpMorning1.value,bpMorning2.value,bpMorning3.value].map(v=>v.trim()).filter(Boolean),pm=[bpEvening1.value,bpEvening2.value,bpEvening3.value].map(v=>v.trim()).filter(Boolean);if(am.some(v=>!valid(v))||pm.some(v=>!valid(v))){showToast('Enter BP as systolic/diastolic');return}let x=d();x.body.bpMorningReadings=am;x.body.bpEveningReadings=pm;x.body.bpMorning=lowestBP(am);x.body.bpEvening=lowestBP(pm);x.body.bp=x.body.bpEvening||x.body.bpMorning;screen='dashboard';save()}
function saveSupplements(){let x=d();x.meds.creatine=document.querySelector('[data-supp="creatine"]')?.checked||false;x.meds.ramipril=document.querySelector('[data-supp="ramipril"]')?.checked||false;x.meds.minoxidil=document.querySelector('[data-supp="minoxidil"]')?.checked||false;x.meds.finasteride=document.querySelector('[data-supp="finasteride"]')?.checked||false;x.meds.supplementsTaken=x.meds.creatine&&x.meds.ramipril&&x.meds.minoxidil&&x.meds.finasteride;screen='dashboard';save()}
function dashboard(){if(category==='overall')return overallView();if(category==='sleep')return sleepDetail();if(category==='recovery')return recoveryDetail();if(category==='activity')return activityDetail();if(category==='nutrition')return nutritionDetail()}
function render(){
 renderNav();
 let el=document.getElementById('app');
 if(screen==='entry')el.innerHTML=entryView();
 else if(screen==='plan')el.innerHTML=planView();
 else if(screen==='gym')el.innerHTML=gymView();
 else if(screen==='history')el.innerHTML=historyView();
 else if(screen==='settings')el.innerHTML=settingsView();
 else if(screen==='food')el.innerHTML=foodEntryView();
 else if(screen==='bp')el.innerHTML=bpEntryView();
 else if(screen==='supplements')el.innerHTML=supplementsView();
 else el.innerHTML=dashboard();
 document.getElementById('dateLabel').textContent=new Date().toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long',year:'numeric'});
}
function saveManual(e){e.preventDefault();screen='entry';render()}
function togglePlan(i){data.plan.sessions[i].done=!data.plan.sessions[i].done;save()}
function addPlan(){let type=prompt('Activity type (e.g. Run, Gym, Pilates, Football)');if(!type)return;let target=prompt('Target (e.g. 6km, Upper body, 40 min)')||'';let day=prompt('Day (Mon/Tue/Wed...)')||'';data.plan.sessions.push({day,type,target,priority:'Medium',done:false});save()}
function editPlan(i){let s=data.plan.sessions[i];s.type=prompt('Activity type',s.type)||s.type;s.target=prompt('Target',s.target)||s.target;s.priority=prompt('Priority: High / Medium / Low',s.priority)||s.priority;save()}
function removePlan(i){if(confirm('Remove this planned session?')){data.plan.sessions.splice(i,1);save()}}
function addGym(){let name=prompt('Session name', 'Upper body');if(!name)return;let ex=[];while(true){let e=prompt('Exercise name (Cancel when finished)');if(!e)break;let sets=prompt('Sets × reps (e.g. 3 × 10)','3 × 10')||'';let weight=prompt('Weight / assistance','')||'';ex.push({e,sets,weight})}data.gym.unshift({date:today,name,exercises:ex});save()}
function removeGym(i){if(confirm('Remove this gym session?')){data.gym.splice(i,1);save()}}

render();
if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').catch(()=>{});}
const initialAction=new URLSearchParams(location.search).get('action');
if(initialAction==='food'){screen='food';render()}else if(initialAction==='bp'){screen='bp';render()}else if(initialAction==='supplements'){screen='supplements';render()}else if(initialAction==='settings'){screen='settings';render()}
</script>
